upstream desk { server api1:8080; server api2:8080; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 access_log off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:3000; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
 location /api/ { proxy_pass http://desk; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
 location /ws { proxy_pass http://desk; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 60s; }
 location / { try_files $uri $uri/ /index.html; }
}
