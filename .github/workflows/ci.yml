name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: TypeScript, unit, build, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: node scripts/openapi.ts && git diff --exit-code docs/openapi.json
  integration:
    name: Two replicas, browser collaboration, failure recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start quickstart stack
        run: |
          node scripts/init-env.mjs
          docker compose up -d --build --wait
          docker compose exec -e API_A=http://localhost:8080 api1 node scripts/seed.ts > /dev/null
      - name: API and WebSocket integration
        run: docker compose run --build --rm --no-deps integration
      - name: Real browser collaboration and offline recovery
        run: |
          set -a
          . ./.env
          set +a
          npm run e2e
      - name: Redis, replica, and PostgreSQL interruption
        run: |
          set -a
          . ./.env
          set +a
          node scripts/faults.ts
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: docker compose down -v
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
